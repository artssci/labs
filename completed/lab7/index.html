<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/vuetify@3.x/dist/vuetify.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font@7.x/css/materialdesignicons.min.css" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vuetify@3.x/dist/vuetify.min.js"></script>
    <script src="app.js" defer></script>

    <title>Project Portfolio</title>
</head>

<body>
    <div id="app">
        <v-app>
            <v-app-bar class="bg-deep-orange-accent-2" elevation="2">           

                <v-app-bar-nav-icon @click="toggleDrawer"></v-app-bar-nav-icon>
                <!-- <v-app-bar-title class="font-weight-black"> -->
                    <v-app-bar-title>
                    CODING INQUIRY PORTFOLIO</span>
                </v-app-bar-title>
            </v-app-bar>

            <!-- <v-navigation-drawer v-model="openDrawer" class="orange-lighten-3"> -->
            <v-navigation-drawer v-model="openDrawer" class="bg-deep-orange-accent-2">
                <!-- <v-list-item href="https://artssci.github.io/labs/completed/lab7/">Home</v-list-item>
                <v-divider></v-divider> -->
                <v-list-item v-for="item in projects" :key="item.title" :href="item.url">
                    {{item.title}}
                </v-list-item>
            </v-navigation-drawer>

            <!-- <v-main class="bg-yellow-lighten-5"> -->
            <v-main>
                <v-container fluid class="pa-10">
                <!-- <v-container> -->
                    <v-row>
                        <v-col cols="6" v-for="item in projects" :key="item.title">
                            <v-card elevation="1" :href="item.url">
                                <v-img :src="item.image"></v-img>

                                <v-card-title >
                                <!-- <v-card-title> -->
                                    {{item.title}}
                                </v-card-title>

                                <v-card-text>
                                    {{item.description}}
                                </v-card-text>
                            </v-card>
                        </v-col>
                    </v-row>
                </v-container>
            </v-main>

            <v-footer class="bg-bg-deep-orange-accent-2">
            <strong>ARTSSCI-3C03 Portfolio 2026.
        </v-footer>
        </v-app>
    </div>
</body>

</html>
