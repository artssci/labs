<!DOCTYPE html>
<html>

<head>
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font@latest/css/materialdesignicons.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/vuetify@3.4.10/dist/vuetify.min.css" rel="stylesheet">
</head>

<body>
    <div id="app">
        <v-app>
            <v-main>
                <v-container>
                    <v-card width="400" class="mx-auto mt-10" elevation="10">
                        <v-card-title>User: {{ userName }}</v-card-title>
                        <v-card-subtitle>Role: {{ accountType }}</v-card-subtitle>

                        <v-card-text>
                            <p>Current Status:</p>
                            <v-chip color="primary">
                                Digital Footprint: {{ digitalFootprint }} MB
                            </v-chip>
                        </v-card-text>
                    </v-card>
                </v-container> </v-main>
        </v-app>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vuetify@3.4.10/dist/vuetify.min.js"></script>
    <script>
        const { createApp, ref } = Vue;
        const { createVuetify } = Vuetify;
        const vuetify = createVuetify();

        createApp({
            setup() {
                const userName = ref("Sam"); // String (Text)
                const accountType = ref("Inquirer"); // String
                let digitalFootprint = ref("1.2GB of harvested personal metadata");
                let isTrackingEnabled = ref(true); // Boolean (True/False)

                return {
                    userName,
                    accountType,
                    digitalFootprint,
                    isTrackingEnabled
                }
            }
        }).use(vuetify).mount('#app');
    </script>
</body>

</html>
