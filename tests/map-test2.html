<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/vuetify@3.x/dist/vuetify.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font@7.x/css/materialdesignicons.min.css" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vuetify@3.x/dist/vuetify.min.js"></script>
    <script src="app.js" defer></script>
    <title>Document</title>

</head>

<style>
    .map-dot {
        position: absolute !important;
        transform: translate(-50%, -50%);
        /* Centers the icon on the coordinate */
        transition: transform 0.2s;
    }

    .map-dot:hover {
        transform: translate(-50%, -50%) scale(1.3);
    }
</style>

<body>
    <div id="app">
        <v-app>
            <v-container>
                <v-card class="mx-auto" max-width="800" elevation="10">

                    <div style="position: relative; overflow: hidden;">

                        <v-img @click="getCoordinates" src="map.svg" cover></v-img>

                        <v-btn v-for="(point, index) in points" :key="index" icon size="small" color="primary"
                            class="map-dot" :style="{ top: point.y + '%', left: point.x + '%' }"
                            @click="selectPoint(point)">
                            <v-icon>mdi-map-marker</v-icon>
                        </v-btn>
                    </div>

                    <v-card-text class="text-center">
                        <h3>{{ activeStory.title || 'Click a marker to start the inquiry' }}</h3>
                    </v-card-text>
                </v-card>

                <v-dialog v-model="dialog" width="400">
                    <v-card>
                        <v-card-title>{{ activeStory.title }}</v-card-title>
                        <v-card-text>{{ activeStory.description }}</v-card-text>

                        <v-card-actions class="flex-column">
                            <v-btn v-for="choice in activeStory.choices" block class="mb-2" @click="makeChoice(choice)">
                                {{ choice.text }}
                            </v-btn>
                        </v-card-actions>
                    </v-card>
                </v-dialog>
            </v-container>
        </v-app>
    </div>

</body>

</html>
